openapi: 3.0.3
info:
  title: Robot Simulator API
  description: API para simular movimientos de robots en un grid de forma secuencial.
  version: 0.0.1
servers:
  - url: http://localhost:8080
    description: Servidor local
paths:
  /api/robots:
    post:
      operationId: simulate
      tags:
        - Robot Simulator
      summary: Simula el movimiento de múltiples robots
      description: Acepta un texto con las dimensiones del grid, seguidas de la posición inicial y comandos para cada robot.
      requestBody:
        $ref: '#/components/requestBodies/RobotInput'
      responses:
        '200':
          $ref: '#/components/responses/RobotOutput'

components:
  schemas:
    Dimension:
      type: integer
      format: int32
      minimum: 0
      maximum: 9
    Position:
      type: object
      properties:
        x:
          $ref: '#/components/schemas/Dimension'
        y:
          $ref: '#/components/schemas/Dimension'
    Commands:
      type: string
      pattern: ^[A-Z]*$
      description: "String with all commands for a robot"
      example: "LMLMLMLMM"
    Direction:
      type: string
      pattern: ^[N,S,E,W]{1}$
      description: "String with the robot's direction"
      example: "W"
    Grid:
      type: object
      properties:
        dimensions:
          $ref: '#/components/schemas/Position'
    Robot:
      type: object
      properties:
        initialPosition:
          $ref: '#/components/schemas/Position'
        commands:
          $ref: '#/components/schemas/Commands'
        direction:
          $ref: '#/components/schemas/Direction'
    RobotsInput:
      type: object
      properties:
        grid:
          $ref: '#/components/schemas/Grid'
        robots:
          type: array
          items:
            $ref: '#/components/schemas/Robot'
  requestBodies:
    RobotInput:
      description: Datos de entrada para simular el movimiento de robots
      required: true
      content:
        text/plain:
          schema:
            type: string
            example: "5 5\n1 2 N\nLMLMLMLMM\n3 3 E\nMMRMMRMRRM"
  responses:
    RobotOutput:
      description: Respuesta exitosa con las posiciones finales de los robots
      content:
        text/plain:
          schema:
            type: string
            example: "1 3 N\n5 1 E"